<!doctype html>
<html>

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Bio Tracker XR</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

<nav>

    <div class="brand">
        Bio Tracker XR
    </div>


    <div class="links">

        <a href="{{ url_for('dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('students') }}">
            Students
        </a>

        <a href="{{ url_for('attendance') }}">
            Attendance
        </a>

        <a href="{{ url_for('attendance_history') }}">
            History
        </a>

        <a href="{{ url_for('reports') }}">
            Reports
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

</nav>


<main>

    {% with messages = get_flashed_messages() %}

        {% for message in messages %}

            <div class="flash">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    {% block content %}

    {% endblock %}

</main>


</body>

</html>
