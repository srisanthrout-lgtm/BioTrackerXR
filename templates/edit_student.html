{% extends "base.html" %}

{% block content %}

<style>

    .edit-box {
        max-width: 650px;
        margin: 20px auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .edit-box h1 {
        margin-top: 0;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
    }

    .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 15px;
        box-sizing: border-box;
    }

    .form-group input:focus {
        outline: none;
        border-color: #667eea;
    }

    .buttons {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }

    .save-btn,
    .cancel-btn {
        padding: 11px 18px;
        border-radius: 7px;
        text-decoration: none;
        border: none;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
    }

    .save-btn {
        background: #667eea;
        color: white;
    }

    .cancel-btn {
        background: #eee;
        color: #333;
    }

</style>


<div class="edit-box">

    <h1>✏️ Edit Student</h1>

    <form method="POST">

        <div class="form-group">

            <label>Register Number</label>

            <input
                type="text"
                name="register_no"
                value="{{ student.register_no }}"
                required
            >

        </div>


        <div class="form-group">

            <label>Student Name</label>

            <input
                type="text"
                name="name"
                value="{{ student.name }}"
                required
            >

        </div>


        <div class="form-group">

            <label>Department</label>

            <input
                type="text"
                name="department"
                value="{{ student.department }}"
                required
            >

        </div>


        <div class="form-group">

            <label>Year</label>

            <input
                type="text"
                name="year"
                value="{{ student.year }}"
                required
            >

        </div>


        <div class="buttons">

            <button type="submit" class="save-btn">
                Save Changes
            </button>

            <a
                href="{{ url_for('students') }}"
                class="cancel-btn"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
